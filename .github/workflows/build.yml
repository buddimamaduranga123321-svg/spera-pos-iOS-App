name: Build Spera POS iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Folder Structure from FLATTEN-MANIFEST.csv
        run: |
          python3 -c '
          import csv, os, shutil

          if not os.path.exists("FLATTEN-MANIFEST.csv"):
              raise FileNotFoundError("FLATTEN-MANIFEST.csv not found!")

          with open("FLATTEN-MANIFEST.csv", mode="r", encoding="utf-8-sig") as f:
              reader = csv.reader(f)
              for row in reader:
                  if len(row) < 2:
                      continue
                  c0, c1 = row[0].strip(), row[1].strip()
                  if not c0 or not c1 or c0 == c1:
                      continue
                  if os.path.isfile(c0) and not os.path.exists(c1):
                      src, dst = c0, c1
                  elif os.path.isfile(c1) and not os.path.exists(c0):
                      src, dst = c1, c0
                  else:
                      continue
                  dst = dst.lstrip("./\\").replace("\\", "/")
                  parent = os.path.dirname(dst)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  shutil.move(src, dst)
                  print(f"Restored: {src} -> {dst}")
          '

      - name: Setup Capacitor Node Modules & CocoaPods
        run: |
          PODFILE=$(find . -name "Podfile" -maxdepth 4 | head -n 1)
          if [ -n "$PODFILE" ]; then
            POD_DIR=$(dirname "$PODFILE")
            python3 -c '
          import re, subprocess, os

          podfile_path = "'"$PODFILE"'"
          with open(podfile_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Fix relative node_modules path when Podfile is inside ./App
          content = content.replace("../../node_modules", "../node_modules")
          with open(podfile_path, "w", encoding="utf-8") as f:
              f.write(content)

          # Detect required Capacitor/npm packages from Podfile
          pkgs = set(re.findall(r"node_modules/(@[^/\x27\"]+/[^/\x27\"]+|[^/\x27\"]+)", content))
          pkgs.add("@capacitor/ios")

          # Match Capacitor major version to iOS deployment target
          ver_suffix = ""
          m = re.search(r"platform\s+:ios\s*,\s*[\x27\"](\d+)", content)
          if m:
              ios_ver = int(m.group(1))
              if ios_ver <= 13:
                  ver_suffix = "@6"
              elif ios_ver == 14:
                  ver_suffix = "@7"

          install_list = [p + ver_suffix for p in sorted(pkgs)]
          print("Installing npm packages:", install_list)
          subprocess.run(["npm", "install", "--no-save", "--legacy-peer-deps"] + install_list, check=True)
          '
            echo "Running pod install in $POD_DIR"
            cd "$POD_DIR"
            pod install
          fi

      - name: Build Xcode Project
        run: |
          WS=$(find . -name "*.xcworkspace" -not -path "*.xcodeproj/*" -maxdepth 4 | head -n 1)
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 4 | head -n 1)
          if [ -n "$WS" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WS" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); schemes=[s for s in d['workspace']['schemes'] if not s.startswith('Pods-') and s != 'Pods']; print(schemes[0] if schemes else 'App')" 2>/dev/null || echo "App")
            echo "Building workspace $WS with scheme $SCHEME"
            xcodebuild -workspace "$WS" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          elif [ -n "$PROJ" ]; then
            echo "Building project $PROJ"
            xcodebuild -project "$PROJ" \
              -alltargets \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "No .xcworkspace or .xcodeproj found!"
            exit 1
          fi

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle produced!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Spera-POS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spera-POS-iOS
          path: Spera-POS.ipa
